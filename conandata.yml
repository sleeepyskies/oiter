requirements:
  # oiter dependencies
  - "imgui/1.92.8"
  - "lyra/1.7.0"

  # 2iREN dependencies
  - "cgltf/1.15"
  - "yaml-cpp/0.9.0"
  - "glm/1.0.1"
  - "libassert/2.2.1"
  - "opengl/system"
  - ref: "glfw/3.4"
    options:
      with_wayland: False
  - ref: "glad/2.0.8"
    options:
      gl_version: "4.6"
      gl_profile: "core"
